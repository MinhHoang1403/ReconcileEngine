name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Evaluation smoke
        run: uv run python scripts/run_evaluation.py --orders 1000 --seed 20261016 --output reports/ci-evaluation.json > /dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-validation-only
      DATABASE_URL: postgresql+psycopg://smartrecon:ci-validation-only@db:5432/smartrecon
      CORS_ORIGINS: https://reconcile.example.invalid
      BACKEND_IMAGE: smartrecon-backend:ci
      FRONTEND_IMAGE: smartrecon-frontend:ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build release containers
        run: docker compose build
