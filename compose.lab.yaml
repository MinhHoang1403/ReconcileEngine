# Always use with an explicit --project-name smartrecon_lab and a lab-only env file.
services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the lab database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the lab database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a lab-only password}
  migrate:
    image: ${BACKEND_IMAGE:?Set a lab-only backend image}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the lab database URL}
  backend:
    image: ${BACKEND_IMAGE:?Set a lab-only backend image}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the lab database URL}
      ARTIFACTS_PATH: /artifacts/lab
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    volumes: !override
      - artifacts_data:/artifacts
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:?Set a free lab API port}:8000"
  frontend:
    image: ${FRONTEND_IMAGE:?Set a lab-only frontend image}
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:?Set a free lab website port}:5173"
