[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrecon"
version = "0.1.0"
description = "Smart financial reconciliation and analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<23",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.10,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
