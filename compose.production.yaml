services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrecon}
      POSTGRES_USER: ${POSTGRES_USER:-smartrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: always

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ARTIFACTS_PATH: /artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DEMO_MODE: "false"
    restart: always

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: always
