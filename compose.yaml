x-backend-container: &backend-container
  image: ${BACKEND_IMAGE:-smartrecon-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrecon}
      POSTGRES_USER: ${POSTGRES_USER:-smartrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    <<: *backend-container
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://smartrecon:change-this-local-password@db:5432/smartrecon}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-container
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "backend.smartrecon_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://smartrecon:change-this-local-password@db:5432/smartrecon}
      ARTIFACTS_PATH: /artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - artifacts_data:/artifacts
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-smartrecon-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5173",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  pg_data:
  artifacts_data:
